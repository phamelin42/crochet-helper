# Phase 3 — Amélioration continue.
# Analyse 7 et 28 jours, propose au maximum trois actions, ouvre les PR.
name: Amelioration hebdomadaire

on:
  schedule:
    - cron: '0 4 * * 1' # lundi 06h00 heure de Paris
  workflow_dispatch:

concurrency:
  group: amelioration-hebdo
  cancel-in-progress: false

jobs:
  ameliorer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: anthropics/claude-code-action@v1
        env:
          UMAMI_URL: ${{ secrets.UMAMI_URL }}
          UMAMI_TOKEN: ${{ secrets.UMAMI_TOKEN }}
          UMAMI_WEBSITE_ID: ${{ secrets.UMAMI_WEBSITE_ID }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: '/amelioration-hebdo'
          claude_args: '--max-turns 40'
