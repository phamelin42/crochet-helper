# Phase 3 — Amélioration continue.
#
# Même modèle que « Lot suivant » : le workflow prépare les données (Umami sur
# 7 et 28 jours par tools/umami.mjs, rapports de la branche `rapports`),
# l'agent travaille sans secret ni droit d'écriture et commite ses fiches sur
# une branche locale `hebdo-<slug>`. Le job `publier`, sur une autre machine
# et depuis un checkout propre de main, reçoit ces branches en bundle, les
# valide comme des données non fiables, les pousse, lance la CI, ouvre les PR
# et l'issue du point : l'agent n'atteint jamais le code qui a le jeton.
name: Amelioration hebdomadaire

on:
  schedule:
    - cron: '0 4 * * 1' # lundi 06h00 heure de Paris (04h00 UTC en été)
  workflow_dispatch:

concurrency:
  group: amelioration-hebdo
  cancel-in-progress: false

jobs:
  ameliorer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: read # les points hebdomadaires précédents
      id-token: write # jeton de l'app Claude, révoqué à la fin de son étape
    outputs:
      agir: ${{ steps.garde.outputs.agir }}
      raison: ${{ steps.garde.outputs.raison }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lire Umami et les rapports
        env:
          UMAMI_URL: ${{ secrets.UMAMI_URL }}
          UMAMI_TOKEN: ${{ secrets.UMAMI_TOKEN }}
          UMAMI_WEBSITE_ID: ${{ secrets.UMAMI_WEBSITE_ID }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p .pilote
          node tools/umami.mjs hebdo > .pilote/umami.json
          if git fetch -q "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" rapports 2>/dev/null; then
            git archive FETCH_HEAD reports | tar -x -C .pilote
          fi
          # Le point d'il y a deux semaines annonçait des seuils à vérifier.
          gh issue list --repo "$REPO" --state all --limit 4 \
            --search 'in:title "Point hebdomadaire"' --json title,body,createdAt > .pilote/points.json
          git config --global user.name "Pilote automatique"
          git config --global user.email "pilote-automatique@users.noreply.github.com"

      # Sans données, ou trafic sous le plancher avec déjà trois fiches en
      # attente : rien à proposer qui ne double la file.
      - id: garde
        name: Faut-il un agent ?
        run: |
          node tools/pilote.mjs garde-hebdo .pilote/umami.json automation/avancement.md |
            tee -a "$GITHUB_STEP_SUMMARY"

      - id: claude
        if: steps.garde.outputs.agir == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: '/amelioration-hebdo'
          claude_args: >-
            --max-turns 60
            --allowedTools "Read,Glob,Grep,Edit,MultiEdit,Write,Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(git:*),Bash(ls:*)"

      - name: Empaqueter les fiches de l'agent
        if: always() && steps.claude.outcome != 'skipped' && steps.garde.outputs.agir == 'true'
        env:
          EXECUTION: ${{ steps.claude.outputs.execution_file }}
        run: |
          a="$RUNNER_TEMP/artefact"
          mkdir -p "$a"
          refs=$(git for-each-ref --format='%(refname)' 'refs/heads/hebdo-*' || true)
          if [ -n "$refs" ]; then
            # shellcheck disable=SC2086
            git bundle create "$a/hebdo.bundle" $refs ^origin/main || true
          fi
          cp -r .pilote "$a/pilote" 2>/dev/null || true
          cp "$EXECUTION" "$a/execution.json" 2>/dev/null || true

      - if: always() && steps.claude.outcome != 'skipped' && steps.garde.outputs.agir == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hebdo
          path: ${{ runner.temp }}/artefact
          retention-days: 14

  publier:
    needs: ameliorer
    if: always() && needs.ameliorer.outputs.agir != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write # lancer la CI sur les branches publiées
    steps:
      # Checkout de main, jamais le travail de l'agent : c'est ce code-ci qui
      # s'exécute avec le jeton.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - if: needs.ameliorer.outputs.agir == 'true'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: hebdo
          path: ${{ runner.temp }}/artefact

      - name: Publier les branches et ouvrir les PR
        if: needs.ameliorer.outputs.agir == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          a="$RUNNER_TEMP/artefact"
          p="$a/pilote"
          distant="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          liste=""
          branches=""
          if [ -s "$a/hebdo.bundle" ]; then
            branches=$(git bundle list-heads "$a/hebdo.bundle" | awk '{print $2}' |
              sed -n 's#^refs/heads/\(hebdo-[a-z0-9-]*\)$#\1#p')
          fi
          for branche in $branches; do
            git fetch -q "$a/hebdo.bundle" "refs/heads/$branche:refs/heads/$branche"
            if [ -z "$(git log --oneline origin/main.."$branche")" ]; then continue; fi
            # Le point hebdo n'écrit que des fiches : au plus trois fichiers,
            # tous dans prompts/ (skill amelioration-hebdo, § 3).
            fichiers=$(git diff --name-only origin/main..."$branche")
            if echo "$fichiers" | grep -qvE '^prompts/' || [ "$(echo "$fichiers" | wc -l)" -gt 3 ]; then
              echo "::error::$branche touche autre chose que prompts/ ou plus de trois fichiers : publication refusée."
              continue
            fi
            git push -q "$distant" "refs/heads/$branche:refs/heads/$branche"
            gh workflow run ci.yml --repo "$REPO" --ref "$branche"
            titre=$(head -n 1 "$p/$branche.titre" 2>/dev/null | cut -c1-200 || true)
            [ -n "$titre" ] || titre=$(git log -1 --format=%s "$branche")
            corps="$RUNNER_TEMP/$branche.md"
            if [ -s "$p/$branche.md" ]; then cp "$p/$branche.md" "$corps"; else
              git log --format='- %s' origin/main.."$branche" > "$corps"; fi
            url=$(gh pr create --repo "$REPO" --base main --head "$branche" \
              --title "$titre" --body-file "$corps")
            liste="$liste- $titre — $url"$'\n'
          done

          if [ -s "$p/issue-titre.txt" ] && [ -f "$p/issue-corps.md" ]; then
            cp "$p/issue-corps.md" "$RUNNER_TEMP/corps.md"
            printf '\n### PR ouvertes par ce point\n%s' "${liste:-Aucune.}" >> "$RUNNER_TEMP/corps.md"
            gh issue create --repo "$REPO" \
              --title "$(head -n 1 "$p/issue-titre.txt" | cut -c1-200)" \
              --body-file "$RUNNER_TEMP/corps.md"
          fi

      - name: Noter le coût
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RAISON: ${{ needs.ameliorer.outputs.raison }}
        run: |
          export DISTANT="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          execution="$RUNNER_TEMP/artefact/execution.json"
          [ -f "$execution" ] || execution=-
          cout=$(node tools/pilote.mjs cout hebdo "$execution" "$RAISON")
          echo "$cout" >> "$GITHUB_STEP_SUMMARY"
          tools/publier-rapports.sh "Coût du point hebdo" --ligne automation/couts.md "$cout" || true
