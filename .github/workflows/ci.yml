name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lancée par « Lot suivant » : un push fait avec le jeton du workflow
  # ne déclenche pas la CI d'elle-même.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · format · tests · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Aussitôt après `npm ci`, avant tout test : le pilote (`lot-suivant.yml`)
      # et les sessions de développement ont Chromium avant de lancer quoi que
      # ce soit. L'installer ici après `test:tools` faisait passer partout,
      # sauf en CI, un test d'outil qui ouvre un navigateur (PR #78).
      - name: Navigateur (tests d'outils, audit d'accessibilité)
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Tests unitaires
        run: npm run test:ci

      - name: Tests des outils
        run: npm run test:tools

      - name: Build de production + pré-rendu
        run: npm run build

      # Garde-fou de la fiche 07 : sans lui, une régression d'accessibilité ne
      # serait vue qu'en relecture. Sert le build ci-dessus (e2e/static-server.mjs).
      - name: Accessibilité (axe, WCAG 2.1 AA)
        run: npx playwright test
