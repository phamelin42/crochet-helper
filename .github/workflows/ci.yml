name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lancée par « Lot suivant » : un push fait avec le jeton du workflow
  # ne déclenche pas la CI d'elle-même.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · format · tests · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Aussitôt après `npm ci`, avant tout test : le pilote (`lot-suivant.yml`)
      # et les sessions de développement ont Chromium avant de lancer quoi que
      # ce soit. L'installer ici après `test:tools` faisait passer partout,
      # sauf en CI, un test d'outil qui ouvre un navigateur (PR #78).
      - name: Navigateur (tests d'outils, audit d'accessibilité)
        # Trois essais, puis repli : le 11/11/2026, les runners n'ont plus résolu
        # leurs miroirs apt pendant des heures, et `--with-deps` faisait échouer
        # le job avant le premier test. Sans les paquets système (des polices),
        # Chromium se lance quand même sur l'image du runner.
        run: |
          for essai in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "Installation du navigateur : essai $essai échoué."
            sleep 30
          done
          echo "::warning::Paquets système indisponibles : Chromium installé sans eux."
          npx playwright install chromium

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Tests unitaires
        run: npm run test:ci

      - name: Tests des outils
        run: npm run test:tools

      - name: Build de production + pré-rendu
        run: npm run build

      # Garde-fou de la fiche 07 : sans lui, une régression d'accessibilité ne
      # serait vue qu'en relecture. Sert le build ci-dessus (e2e/static-server.mjs).
      - name: Accessibilité (axe, WCAG 2.1 AA)
        run: npx playwright test
