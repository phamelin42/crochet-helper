# Phase 1 — Construction.
#
# Deux jobs, deux machines. `construire` fait tourner l'agent **sans aucun
# droit d'écriture** : il commite en local et ne livre qu'un artefact (un
# bundle git et ses fichiers `.pilote/`). `publier` repart d'un checkout
# propre de main, sur une machine que l'agent n'a jamais touchée, traite
# l'artefact comme une donnée non fiable, et seul lui détient le jeton qui
# pousse la branche, lance la CI et ouvre la PR. Un agent qui aurait réécrit
# un script, `.git/config` ou un binaire de sa machine n'atteint rien ici.
name: Lot suivant

on:
  schedule:
    - cron: '0 */5 * * *' # toutes les 5 h (UTC) ; la garde saute l'agent sans fiche à faire
  workflow_dispatch:

concurrency:
  group: lot-suivant
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write # jeton de l'app Claude, révoqué à la fin de son étape
    outputs:
      agir: ${{ steps.garde.outputs.agir }}
      raison: ${{ steps.garde.outputs.raison }}
      issue_agent: ${{ steps.claude.outcome }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Aucun identifiant dans la configuration git : l'agent ne peut rien pousser.
          persist-credentials: false

      # Une fiche lancée avant la fusion des corrections de la précédente est
      # écrite sans elles, ni sans les pièges ajoutés à CLAUDE.md : c'est arrivé
      # deux fois (fiches 06 et 02). On s'arrête avant de payer l'agent.
      - name: Refuser de partir si des finitions ne sont pas fusionnées
        run: |
          en_attente=""
          for b in $(git branch -r --format='%(refname:short)' | grep '^origin/finitions-' || true); do
            n=$(git rev-list --count origin/main.."$b")
            [ "$n" -gt 0 ] && en_attente="$en_attente $b ($n commits)"
          done
          if [ -n "$en_attente" ]; then
            {
              echo "## Lot suivant non lancé"
              echo "Corrections pas encore fusionnées dans main :$en_attente."
              echo "Merge la PR correspondante, puis relance « Lot suivant »."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Finitions non fusionnées :$en_attente"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Aucune fiche « À faire » sans branche ouverte : l'agent ne ferait
      # que le constater, en tours payés. On s'arrête avant npm ci.
      - id: garde
        name: Y a-t-il une fiche à exécuter ?
        run: |
          node tools/pilote.mjs garde-lot prompts/README.md automation/avancement.md \
            "$(git branch -r --format='%(refname:short)')" | tee -a "$GITHUB_STEP_SUMMARY"

      - if: steps.garde.outputs.agir == 'true'
        run: npm ci

      - name: Préparer l'espace de travail de l'agent
        if: steps.garde.outputs.agir == 'true'
        run: |
          git config --global user.name "Pilote automatique"
          git config --global user.email "pilote-automatique@users.noreply.github.com"
          mkdir -p .pilote

      - id: claude
        if: steps.garde.outputs.agir == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # La garde a choisi la fiche d'après le README : l'agent ne la redéduit pas.
          prompt: '/lot-suivant ${{ steps.garde.outputs.fiche }}'
          claude_args: >-
            --max-turns 200
            --allowedTools "Read,Glob,Grep,Edit,MultiEdit,Write,Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(git:*),Bash(ls:*)"

      # L'agent affirme avoir lancé `npm run verify` ; ici on le constate, et on
      # constate `verify:ci`, qui y ajoute l'audit Playwright — seul juge de
      # l'accessibilité, absent de `verify`. Trois PR de suite ont échoué en CI
      # sur un fichier écrit après la vérification de l'agent (le tableau
      # d'avancement, réaligné par Prettier).
      #
      # Cette étape tourne sur LA MACHINE DE L'AGENT, jamais sur celle qui
      # détient le jeton : elle ne produit qu'une donnée — vert ou non — dont le
      # seul effet est d'ouvrir la PR en brouillon au lieu de la lancer en
      # fusion auto. Elle ne fait pas échouer le job : un travail rouge publié
      # en brouillon est plus utile qu'un travail perdu avec la machine.
      - id: verifier
        name: Constater que verify:ci est vert
        if: always() && steps.claude.outcome == 'success' && steps.garde.outputs.agir == 'true'
        run: |
          npx playwright install --with-deps chromium
          if npm run verify:ci; then
            echo "verify:ci : vert sur la branche de l'agent." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            mkdir -p .pilote
            echo "verify:ci a échoué sur la branche de l'agent" > .pilote/brouillon
            {
              echo "## verify:ci rouge"
              echo "La PR s'ouvre en brouillon : la fusion automatique est écartée."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::verify:ci a échoué ; la PR sera ouverte en brouillon."
          fi

      # Tout ce qui sort de cette machine est une donnée : le job suivant la
      # valide. Un travail inachevé (limite de tours, délai) est commité ici
      # pour être ouvert en brouillon plutôt que perdu avec la machine.
      - name: Empaqueter le travail de l'agent
        if: always() && steps.claude.outcome != 'skipped' && steps.garde.outputs.agir == 'true'
        env:
          ISSUE_AGENT: ${{ steps.claude.outcome }}
          EXECUTION: ${{ steps.claude.outputs.execution_file }}
        run: |
          a="$RUNNER_TEMP/artefact"
          mkdir -p "$a"
          branche=$(git branch --show-current || true)
          if [ "$ISSUE_AGENT" != "success" ] && [ -n "$(git status --porcelain)" ] &&
            [[ "$branche" =~ ^[0-9]{2}-[a-z0-9-]+$ ]]; then
            git add -A
            git commit -qm "Sauvegarder le travail inachevé de l'agent" || true
          fi
          printf '%s\n' "$branche" > "$a/branche.txt"
          if [[ "$branche" =~ ^[0-9]{2}-[a-z0-9-]+$ ]]; then
            git bundle create "$a/travail.bundle" "refs/heads/$branche" ^origin/main || true
          fi
          git add -A && git diff --cached origin/main > "$a/travail.patch" || true
          cp -r .pilote "$a/pilote" 2>/dev/null || true
          cp "$EXECUTION" "$a/execution.json" 2>/dev/null || true

      - if: always() && steps.claude.outcome != 'skipped' && steps.garde.outputs.agir == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: travail-agent
          path: ${{ runner.temp }}/artefact
          retention-days: 14

  publier:
    needs: construire
    if: always() && needs.construire.outputs.agir != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write # lancer la CI sur la branche publiée
    steps:
      # Checkout de main, jamais du travail de l'agent : c'est ce code-ci qui
      # s'exécute avec le jeton.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - if: needs.construire.outputs.agir == 'true'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: travail-agent
          path: ${{ runner.temp }}/artefact

      - id: publier
        name: Publier la branche et ouvrir la PR
        if: needs.construire.outputs.agir == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_AGENT: ${{ needs.construire.outputs.issue_agent }}
        run: |
          set -euo pipefail
          a="$RUNNER_TEMP/artefact"
          p="$a/pilote"
          distant="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"

          # Une décision humaine manquait : l'agent a rédigé la question.
          if [ -s "$p/issue-titre.txt" ] && [ -f "$p/issue-corps.md" ]; then
            gh issue create --repo "$REPO" \
              --title "$(head -n 1 "$p/issue-titre.txt" | cut -c1-200)" \
              --body-file "$p/issue-corps.md"
          fi

          branche=$(head -n 1 "$a/branche.txt" 2>/dev/null || true)
          if [ -z "$branche" ] || [ "$branche" = "main" ]; then
            echo "Pas de branche de travail : rien à publier." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! [[ "$branche" =~ ^[0-9]{2}-[a-z0-9-]+$ ]]; then
            echo "::error::Nom de branche inattendu, publication refusée : $branche"
            exit 1
          fi
          if [ ! -s "$a/travail.bundle" ]; then
            echo "Branche $branche sans commit : rien à publier." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git fetch -q "$a/travail.bundle" "refs/heads/$branche:refs/heads/$branche"
          if [ -z "$(git log --oneline origin/main.."$branche")" ]; then
            echo "Branche $branche sans commit : rien à publier." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Un workflow modifié dans une PR s'exécute avec les secrets du dépôt :
          # l'agent n'a pas le droit de toucher à sa propre configuration.
          if git diff --name-only origin/main..."$branche" | grep -qE '^(\.github|\.claude)/'; then
            echo "::error::La branche modifie .github/ ou .claude/ : publication refusée."
            exit 1
          fi

          git push --quiet "$distant" "refs/heads/$branche:refs/heads/$branche"
          # Un push fait avec ce jeton ne déclenche aucun workflow : on lance la CI
          # explicitement, son résultat s'attache au dernier commit de la branche.
          gh workflow run ci.yml --repo "$REPO" --ref "$branche"

          titre=$(head -n 1 "$p/pr-titre.txt" 2>/dev/null | cut -c1-200 || true)
          [ -n "$titre" ] || titre=$(git log -1 --format=%s "$branche")
          corps="$RUNNER_TEMP/pr-corps.md"
          if [ -s "$p/pr-corps.md" ]; then cp "$p/pr-corps.md" "$corps"; else
            git log --format='- %s' origin/main.."$branche" > "$corps"; fi
          brouillon=()
          if [ -f "$p/brouillon" ] || [ "$ISSUE_AGENT" != "success" ]; then
            brouillon=(--draft)
          fi
          if ! url=$(gh pr create --repo "$REPO" --base main --head "$branche" \
            --title "$titre" --body-file "$corps" "${brouillon[@]}"); then
            echo "::error::La branche $branche est poussée, mais GitHub a refusé d'ouvrir la PR. Active « Allow GitHub Actions to create and approve pull requests » dans Settings → Actions → General."
            exit 1
          fi
          echo "PR ouverte : $url" | tee -a "$GITHUB_STEP_SUMMARY"
          # Une PR en brouillon (travail inachevé) ne peut pas fusionner seule.
          if [ ${#brouillon[@]} -eq 0 ]; then tools/fusion-auto.sh "$url"; else
            echo "Fusion auto non activée : PR en brouillon ($url)" | tee -a "$GITHUB_STEP_SUMMARY"; fi

      - name: Noter le coût
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RAISON: ${{ needs.construire.outputs.raison }}
        run: |
          export DISTANT="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          execution="$RUNNER_TEMP/artefact/execution.json"
          [ -f "$execution" ] || execution=-
          cout=$(node tools/pilote.mjs cout lot "$execution" "$RAISON")
          echo "$cout" >> "$GITHUB_STEP_SUMMARY"
          tools/publier-rapports.sh "Coût du lot" --ligne automation/couts.md "$cout" || true
