# Phase 1 — Construction.
#
# L'agent exécute la fiche suivante de prompts/ et commite en local, sans
# droit d'écriture sur GitHub. L'étape suivante, écrite ici et donc hors de
# portée de l'agent, publie la branche, lance la CI dessus et ouvre la PR avec
# le jeton du workflow (celui de l'app Claude est révoqué à la fin de son étape).
name: Lot suivant

on:
  schedule:
    - cron: '0 3 * * 0' # dimanche 05h00 heure de Paris (03h00 UTC en été)
  workflow_dispatch:

concurrency:
  group: lot-suivant
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: write # lancer la CI sur la branche publiée
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Aucun identifiant dans la configuration git : l'agent ne peut rien pousser.
          persist-credentials: false

      # Une fiche lancée avant la fusion des corrections de la précédente est
      # écrite sans elles, ni sans les pièges ajoutés à CLAUDE.md : c'est arrivé
      # deux fois (fiches 06 et 02). On s'arrête avant de payer l'agent.
      - name: Refuser de partir si des finitions ne sont pas fusionnées
        run: |
          en_attente=""
          for b in $(git branch -r --format='%(refname:short)' | grep '^origin/finitions-' || true); do
            n=$(git rev-list --count origin/main.."$b")
            [ "$n" -gt 0 ] && en_attente="$en_attente $b ($n commits)"
          done
          if [ -n "$en_attente" ]; then
            {
              echo "## Lot suivant non lancé"
              echo "Corrections pas encore fusionnées dans main :$en_attente."
              echo "Merge la PR correspondante, puis relance « Lot suivant »."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Finitions non fusionnées :$en_attente"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Préparer l'espace de travail de l'agent
        run: |
          git config --global user.name "Pilote automatique"
          git config --global user.email "pilote-automatique@users.noreply.github.com"
          mkdir -p .pilote

      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: '/lot-suivant'
          claude_args: >-
            --max-turns 200
            --allowedTools "Read,Glob,Grep,Edit,MultiEdit,Write,Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(git:*),Bash(ls:*)"

      - id: publier
        name: Publier la branche et ouvrir la PR
        if: always() && steps.claude.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_AGENT: ${{ steps.claude.outcome }}
        run: |
          set -euo pipefail
          distant="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"

          # Une décision humaine manquait : l'agent a rédigé la question.
          if [ -s .pilote/issue-titre.txt ]; then
            gh issue create --repo "$REPO" \
              --title "$(head -n 1 .pilote/issue-titre.txt)" \
              --body-file .pilote/issue-corps.md
          fi

          branche=$(git branch --show-current)

          # L'agent a été interrompu (limite de tours, délai) : on commite ce
          # qu'il n'avait pas commité, pour l'ouvrir en brouillon plutôt que de
          # le perdre avec la machine.
          if [ "$ISSUE_AGENT" != "success" ] && [ -n "$(git status --porcelain)" ] &&
            [[ "$branche" =~ ^[0-9]{2}-[a-z0-9-]+$ ]]; then
            git add -A
            git commit -qm "Sauvegarder le travail inachevé de l'agent"
          fi
          if [ -z "$branche" ] || [ "$branche" = "main" ]; then
            echo "Pas de branche de travail : rien à publier." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! [[ "$branche" =~ ^[0-9]{2}-[a-z0-9-]+$ ]]; then
            echo "::error::Nom de branche inattendu, publication refusée : $branche"
            exit 1
          fi
          if [ -z "$(git log --oneline origin/main..HEAD)" ]; then
            echo "Branche $branche sans commit : rien à publier." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Un workflow modifié dans une PR s'exécute avec les secrets du dépôt :
          # l'agent n'a pas le droit de toucher à sa propre configuration.
          if git diff --name-only origin/main..HEAD | grep -qE '^(\.github|\.claude)/'; then
            echo "::error::La branche modifie .github/ ou .claude/ : publication refusée."
            exit 1
          fi

          git push --quiet "$distant" "HEAD:refs/heads/$branche"
          # Un push fait avec ce jeton ne déclenche aucun workflow : on lance la CI
          # explicitement, son résultat s'attache au dernier commit de la branche.
          gh workflow run ci.yml --repo "$REPO" --ref "$branche"

          titre=$(head -n 1 .pilote/pr-titre.txt 2>/dev/null || git log -1 --format=%s)
          [ -s .pilote/pr-corps.md ] || git log --format='- %s' origin/main..HEAD > .pilote/pr-corps.md
          brouillon=()
          if [ -f .pilote/brouillon ] || [ "$ISSUE_AGENT" != "success" ]; then
            brouillon=(--draft)
          fi
          if ! url=$(gh pr create --repo "$REPO" --base main --head "$branche" \
            --title "$titre" --body-file .pilote/pr-corps.md "${brouillon[@]}"); then
            echo "::error::La branche $branche est poussée, mais GitHub a refusé d'ouvrir la PR. Active « Allow GitHub Actions to create and approve pull requests » dans Settings → Actions → General."
            exit 1
          fi
          echo "PR ouverte : $url" | tee -a "$GITHUB_STEP_SUMMARY"

      # Filet de sécurité : si l'agent ou la publication échoue, tout son
      # travail, commité ou non, reste téléchargeable depuis la page de
      # l'exécution — en patch lisible et en bundle git.
      - name: Conserver le travail de l'agent
        if: failure() && (steps.claude.outcome == 'failure' || steps.publier.outcome == 'failure')
        run: |
          git add -A
          git diff --cached origin/main > "$RUNNER_TEMP/travail-agent.patch" || true
          git bundle create "$RUNNER_TEMP/travail-agent.bundle" --all || true

      - if: failure() && (steps.claude.outcome == 'failure' || steps.publier.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: travail-agent
          path: |
            ${{ runner.temp }}/travail-agent.patch
            ${{ runner.temp }}/travail-agent.bundle
          retention-days: 14
