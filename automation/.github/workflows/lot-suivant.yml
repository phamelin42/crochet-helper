# Phase 1 — Construction.
# Exécute la fiche suivante de prompts/ et ouvre une PR. Une par semaine.
name: Lot suivant

on:
  schedule:
    - cron: "0 3 * * 0" # dimanche 05h00 heure de Paris (03h00 UTC en été)
  workflow_dispatch:

concurrency:
  group: lot-suivant
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/lot-suivant"
          claude_args: "--max-turns 60"
