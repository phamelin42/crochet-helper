# Hébergement statique : le build pré-rend chaque page, il n'y a pas de serveur.
[build]
  command = "npm run build"
  publish = "dist/fil-patterns/browser"

[build.environment]
  NODE_VERSION = "24"
  SITE_ORIGIN = "https://patternreader.com"

# L'ancien domaine reste redirigé, chemin par chemin, vers le nouveau.
[[redirects]]
  from = "https://crochet-helper.phamelin.fr/*"
  to = "https://patternreader.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' https://analytics.patternreader.com; font-src 'self'; connect-src 'self' https://analytics.patternreader.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Le lecteur a rejoint la racine ; on redirige les anciennes URL en 301 pour
# ne pas perdre les liens partagés ni le référencement acquis.
[[redirects]]
  from = "/lecteur"
  to = "/fr"
  status = 301

[[redirects]]
  from = "/en/reader"
  to = "/"
  status = 301

# L'anglais est passé langue par défaut : l'ancien arbre anglais sous /en se
# redirige vers la racine, l'ancien arbre français à la racine se redirige
# sous /fr.
[[redirects]]
  from = "/en"
  to = "/"
  status = 301

[[redirects]]
  from = "/glossaire"
  to = "/fr/glossaire"
  status = 301

[[redirects]]
  from = "/en/glossary"
  to = "/glossary"
  status = 301

[[redirects]]
  from = "/bien-formater-son-patron"
  to = "/fr/bien-formater-son-patron"
  status = 301

[[redirects]]
  from = "/en/format-your-pattern"
  to = "/format-your-pattern"
  status = 301

# En dernier : Netlify applique la première règle qui correspond, et ce repli
# correspond à toutes les URL. Placé plus haut, il masquerait les 301 ci-dessus.
# Les pages pré-rendues existent en tant que fichiers ; il ne sert qu'aux URL
# inconnues, que l'application route côté client vers l'accueil.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
