<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-labelledby="t">
  <title id="t">Trois vignettes : coller un pattern, le découper en étapes, lire une étape en grand</title>
  <defs>
    <symbol id="arrow" viewBox="0 0 40 24">
      <path d="M2 12h28M22 4l8 8-8 8" fill="none" stroke="#3fa3ac" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>

  <use href="#arrow" x="222" y="113" width="36" height="24"/>
  <use href="#arrow" x="462" y="113" width="36" height="24"/>

  <!-- vignette 1 : coller -->
  <g transform="translate(20,40)">
    <rect width="200" height="170" rx="14" fill="#fffaf3" stroke="#e3d7cd" stroke-width="2"/>
    <circle cx="26" cy="26" r="18" fill="#d9789b"/>
    <text x="26" y="26" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-weight="700" font-size="18" fill="#fffaf3">1</text>
    <g fill="#3c3550" fill-opacity=".22">
      <rect x="20" y="66" width="160" height="9" rx="4"/>
      <rect x="20" y="90" width="140" height="9" rx="4"/>
      <rect x="20" y="114" width="150" height="9" rx="4"/>
      <rect x="20" y="138" width="90" height="9" rx="4"/>
    </g>
    <rect x="116" y="138" width="3" height="11" fill="#6b5fa8"/>
  </g>

  <!-- vignette 2 : découper en étapes -->
  <g transform="translate(260,40)">
    <rect width="200" height="170" rx="14" fill="#fffaf3" stroke="#e3d7cd" stroke-width="2"/>
    <circle cx="26" cy="26" r="18" fill="#6b5fa8"/>
    <text x="26" y="26" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-weight="700" font-size="18" fill="#fffaf3">2</text>

    <rect x="20" y="54" width="160" height="30" rx="8" fill="#f7e3ea" stroke="#d9789b" stroke-width="2"/>
    <rect x="34" y="64" width="120" height="10" rx="5" fill="#3c3550" fill-opacity=".28"/>

    <line x1="20" y1="93" x2="180" y2="93" stroke="#3c3550" stroke-opacity=".35" stroke-width="2" stroke-dasharray="4 5"/>

    <rect x="20" y="102" width="160" height="30" rx="8" fill="#f2e9e1" stroke="#e3d7cd" stroke-width="2"/>
    <rect x="34" y="112" width="100" height="10" rx="5" fill="#3c3550" fill-opacity=".18"/>

    <line x1="20" y1="141" x2="180" y2="141" stroke="#3c3550" stroke-opacity=".35" stroke-width="2" stroke-dasharray="4 5"/>

    <rect x="20" y="150" width="160" height="16" rx="8" fill="#f2e9e1" stroke="#e3d7cd" stroke-width="2"/>
    <rect x="34" y="155" width="70" height="6" rx="3" fill="#3c3550" fill-opacity=".18"/>
  </g>

  <!-- vignette 3 : lire une étape en grand -->
  <g transform="translate(500,40)">
    <rect width="200" height="170" rx="14" fill="#fffaf3" stroke="#e3d7cd" stroke-width="2"/>
    <circle cx="26" cy="26" r="18" fill="#7fb24f"/>
    <text x="26" y="26" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-weight="700" font-size="18" fill="#fffaf3">3</text>

    <rect x="20" y="56" width="160" height="72" rx="10" fill="#eaf3e1" stroke="#7fb24f" stroke-width="2"/>
    <rect x="36" y="80" width="128" height="12" rx="6" fill="#3c3550" fill-opacity=".4"/>
    <rect x="36" y="102" width="88" height="12" rx="6" fill="#3c3550" fill-opacity=".4"/>

    <circle cx="164" cy="150" r="17" fill="#e3f0fa" stroke="#3fa3ac" stroke-width="2"/>
    <text x="164" y="150" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-weight="700" font-size="13" fill="#24838c">x3</text>
  </g>
</svg>
