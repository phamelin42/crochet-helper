<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" role="img" aria-labelledby="t">
  <title id="t">Pelotes de laine, crochet et aiguilles à tricoter</title>
  <defs>
    <!-- Une pelote : fond à la couleur courante, brins sombres et clairs par-dessus. -->
    <clipPath id="disc"><circle r="1"/></clipPath>
    <symbol id="ball" viewBox="-1 -1 2 2" overflow="visible">
      <g clip-path="url(#disc)">
        <circle r="1" fill="currentColor"/>
        <g fill="none" stroke="#3c3550" stroke-opacity=".22" stroke-width=".06">
          <ellipse rx="1" ry=".32" transform="rotate(-28)"/>
          <ellipse rx="1" ry=".55" transform="rotate(-28)"/>
          <ellipse rx="1" ry=".8" transform="rotate(-28)"/>
          <ellipse rx=".45" ry="1" transform="rotate(35)"/>
          <ellipse rx=".75" ry="1" transform="rotate(35)"/>
        </g>
        <g fill="none" stroke="#fff" stroke-opacity=".5" stroke-width=".05">
          <ellipse rx="1" ry=".2" transform="rotate(-28)"/>
          <ellipse rx="1" ry=".68" transform="rotate(-28)"/>
          <ellipse rx=".6" ry="1" transform="rotate(35)"/>
        </g>
        <circle r="1" fill="url(#shade)"/>
      </g>
    </symbol>
    <radialGradient id="shade" cx=".35" cy=".3" r=".9">
      <stop offset=".55" stop-color="#3c3550" stop-opacity="0"/>
      <stop offset="1" stop-color="#3c3550" stop-opacity=".28"/>
    </radialGradient>
    <symbol id="flower" viewBox="-1 -1 2 2">
      <g fill="#f2aac4">
        <ellipse cy="-.55" rx=".32" ry=".45"/>
        <ellipse cy="-.55" rx=".32" ry=".45" transform="rotate(72)"/>
        <ellipse cy="-.55" rx=".32" ry=".45" transform="rotate(144)"/>
        <ellipse cy="-.55" rx=".32" ry=".45" transform="rotate(216)"/>
        <ellipse cy="-.55" rx=".32" ry=".45" transform="rotate(288)"/>
      </g>
      <circle r=".2" fill="#e9a53a"/>
    </symbol>
  </defs>

  <!-- ombres portées -->
  <g fill="#3c3550" fill-opacity=".1">
    <ellipse cx="215" cy="298" rx="96" ry="12"/>
    <ellipse cx="365" cy="290" rx="70" ry="9"/>
    <ellipse cx="468" cy="304" rx="40" ry="6"/>
  </g>

  <!-- le fil qui s'échappe de la pelote rose et court vers la gauche, avec une boucle -->
  <path d="M140 262c-30 28-62 30-78 10-14-18 4-40 22-30 18 10 6 44-24 50-26 5-44-6-58-20"
        fill="none" stroke="#d9789b" stroke-width="5" stroke-linecap="round"/>

  <!-- aiguilles à tricoter plantées dans la pelote violette -->
  <g stroke="#5f8f37" stroke-width="7" stroke-linecap="round">
    <path d="M318 92 398 250"/>
    <path d="M425 96 338 252"/>
  </g>
  <circle cx="318" cy="92" r="9" fill="#7fb24f"/>
  <circle cx="425" cy="96" r="9" fill="#7fb24f"/>

  <use href="#ball" x="295" y="150" width="140" height="140" color="#8a7fc4"/>

  <!-- petite pelote jaune -->
  <use href="#ball" x="430" y="228" width="76" height="76" color="#e9a53a"/>

  <!-- crochet planté dans la grande pelote -->
  <g stroke="#24838c" stroke-linecap="round" fill="none">
    <path d="M150 40 236 176" stroke-width="9"/>
    <path d="M150 40c-4-8-14-8-16-1-1 5 4 8 8 6" stroke-width="7"/>
  </g>
  <path d="M178 84l14 22" stroke="#3fa3ac" stroke-width="14" stroke-linecap="round"/>

  <use href="#ball" x="120" y="110" width="190" height="190" color="#d9789b"/>

  <!-- fleurs de cerisier -->
  <use href="#flower" x="40" y="70" width="34" height="34"/>
  <use href="#flower" x="468" y="40" width="40" height="40"/>
  <use href="#flower" x="262" y="28" width="24" height="24"/>
  <use href="#flower" x="10" y="176" width="20" height="20"/>
  <use href="#flower" x="494" y="150" width="20" height="20"/>
</svg>
