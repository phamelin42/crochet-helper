<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1000 1500"
  width="1000"
  height="1500"
  role="img"
  aria-labelledby="pin-title"
>
  <title id="pin-title">Pattern Reader — Open in Pattern Reader</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9e4ec"/>
      <stop offset=".5" stop-color="#fffaf3"/>
      <stop offset="1" stop-color="#ece8f7"/>
    </linearGradient>
    <radialGradient id="shade" cx=".35" cy=".3" r=".9">
      <stop offset=".55" stop-color="#3c3550" stop-opacity="0"/>
      <stop offset="1" stop-color="#3c3550" stop-opacity=".28"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="1500" fill="#faf4ed"/>
  <rect x="40" y="40" width="920" height="1420" rx="48" fill="url(#bg)" stroke="#e3d7cd" stroke-width="2"/>
  <rect
    x="66"
    y="66"
    width="868"
    height="1368"
    rx="34"
    fill="none"
    stroke="#f7dbe5"
    stroke-width="4"
    stroke-dasharray="2 16"
    stroke-linecap="round"
  />

  <g transform="translate(500 470)">
    <g fill="none" stroke="#3c3550" stroke-opacity=".22" stroke-width="9">
      <ellipse rx="230" ry="74" transform="rotate(-28)"/>
      <ellipse rx="230" ry="126" transform="rotate(-28)"/>
      <ellipse rx="230" ry="184" transform="rotate(-28)"/>
      <ellipse rx="104" ry="230" transform="rotate(35)"/>
      <ellipse rx="173" ry="230" transform="rotate(35)"/>
    </g>
    <circle r="230" fill="#d9789b"/>
    <g fill="none" stroke="#3c3550" stroke-opacity=".22" stroke-width="9" clip-path="url(#ballclip)">
      <ellipse rx="230" ry="74" transform="rotate(-28)"/>
      <ellipse rx="230" ry="126" transform="rotate(-28)"/>
      <ellipse rx="230" ry="184" transform="rotate(-28)"/>
      <ellipse rx="104" ry="230" transform="rotate(35)"/>
      <ellipse rx="173" ry="230" transform="rotate(35)"/>
    </g>
    <clipPath id="ballclip"><circle r="230"/></clipPath>
    <g fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="7" clip-path="url(#ballclip)">
      <ellipse rx="230" ry="46" transform="rotate(-28)"/>
      <ellipse rx="230" ry="156" transform="rotate(-28)"/>
      <ellipse rx="138" ry="230" transform="rotate(35)"/>
    </g>
    <circle r="230" fill="url(#shade)"/>
    <path
      d="M170 -290 260 -180M170 -290c-14-20-48-20-48 6 0 14 20 20 28 6"
      fill="none"
      stroke="#514a62"
      stroke-width="16"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <text
    x="500"
    y="900"
    text-anchor="middle"
    font-family="'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', system-ui, sans-serif"
    font-weight="700"
    font-size="72"
    fill="#3c3550"
  >Pattern Reader</text>

  <text
    x="500"
    y="990"
    text-anchor="middle"
    font-family="'Karla Variable', Karla, 'Helvetica Neue', Arial, sans-serif"
    font-size="40"
    fill="#514a62"
  >Open in Pattern Reader</text>
  <text
    x="500"
    y="1044"
    text-anchor="middle"
    font-family="'Karla Variable', Karla, 'Helvetica Neue', Arial, sans-serif"
    font-size="40"
    fill="#514a62"
  >Ouvrir dans Pattern Reader</text>

  <g transform="translate(500 1150)">
    <rect x="-260" y="-34" width="520" height="68" rx="34" fill="#f7dbe5" stroke="#d9789b" stroke-width="3"/>
    <text
      x="0"
      y="10"
      text-anchor="middle"
      font-family="'Karla Variable', Karla, 'Helvetica Neue', Arial, sans-serif"
      font-weight="700"
      font-size="30"
      fill="#97445f"
    >patternreader.com</text>
  </g>
</svg>
