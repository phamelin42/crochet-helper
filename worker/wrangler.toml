name = "fil-ia"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[[kv_namespaces]]
binding = "QUOTAS"
id = "6a3e304c983a484a80054240e83f92d2"

# Réglages modifiables sans code. Les secrets ANTHROPIC_API_KEY et SEL_QUOTA
# se posent dans le tableau de bord Cloudflare, jamais ici.
[vars]
MODELE = "claude-sonnet-5-5"
EFFORT = "low"
PRIX_ENTREE_MTOK_USD = "2"
PRIX_SORTIE_MTOK_USD = "10"
BUDGET_MOIS_USD = "7"
QUOTA_JOUR = "3"
ORIGINES = "https://patternreader.com"
MAX_CARACTERES = "60000"
# Recherche Ravelry (ADR-004) : requêtes par personne et par jour. Les secrets
# RAVELRY_USER et RAVELRY_KEY (Basic, lecture seule) se posent dans le tableau
# de bord Cloudflare, jamais ici.
QUOTA_RAVELRY_JOUR = "120"
# Connexion Ravelry (fiche 62, ADR-004). Les secrets RAVELRY_OAUTH_ID et
# RAVELRY_OAUTH_SECRET (application OAuth 2.1 de Fil) se posent dans le tableau
# de bord Cloudflare, jamais ici. Adresses de retour acceptées : comparaison
# exacte, séparées par des virgules.
RAVELRY_REDIRECT_URIS = "https://patternreader.com/ravelry-callback"
# « compte » : recherche et fiche refusées sans jeton de lectrice (403). À passer
# à « ouvert » seulement si Ravelry l'accepte par écrit.
RAVELRY_ACCES = "compte"
